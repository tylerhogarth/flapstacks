  <style>
    :root {
      /* Sampled from the hero's corners and edges so the image blends into the page. */
      --bg: #050201;
      --bg-glow: #28120a;
      --accent: #f5a623;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, var(--bg-glow) 0%, var(--bg) 70%)
        var(--bg);
      color: var(--accent);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    main {
      display: grid;
      place-items: center;
      padding: 2rem;
      width: 100%;
    }

    .hero {
      display: block;
      width: min(90vw, 90vh, 720px);
      height: auto;
      aspect-ratio: 1 / 1;
      /* Soft fade on the image's outer edge removes any visible seam against the page. */
      -webkit-mask-image: radial-gradient(circle at center, #000 62%, transparent 72%);
              mask-image: radial-gradient(circle at center, #000 62%, transparent 72%);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Flapstacks</h1>
    <picture>
      <source
        type="image/webp"
        srcset="assets/hero-800.webp 800w, assets/hero.webp 1254w"
        sizes="min(90vw, 90vh, 720px)">
      <img
        class="hero"
        src="assets/hero.jpg"
        width="1024"
        height="1024"
        fetchpriority="high"
        decoding="async"
        alt="The Flapstacks logo: three golden pancakes topped with a melting pat of butter and dripping syrup, sitting on a dark plate in front of a glowing orange circle, with the word Flapstacks in glossy orange lettering below.">
    </picture>
  </main>
</body>
